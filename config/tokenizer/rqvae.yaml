# RQ-VAE配置
data_text_files: "./data/Toy/item2title.pkl"
text_encoder_model: "../sentence-t5-base"
interaction_files: "./data/Toy/user2item.pkl"
sent_emb_dim: 768
n_codebooks: 4
codebook_size: 256
rq_e_dim: 32
rq_layers: [512, 256, 128]
dropout_prob: 0
loss_type: "mse"
quant_loss_weight: 0.25
balance_weight: 0.0
balance_mode: "batch_entropy"
balance_schedule: "constant"
balance_start_epoch: 0
balance_warmup_epochs: 0
softmax_temperature: 1.0
weight_transform: "nominal"
nominal_gamma: 0.5
nominal_clip_quantile: 0.995
nominal_clip_value: null
balance_eps: 1e-8
disabled_layers: []
layer_weights: []
top_k: 0
token_balance_enabled: true
prefix_balance_enabled: false
prefix_distance_chunk_size: 8192
log_distribution: false
distribution_interval: 100
ema_half_life_epochs: 1.0
ema_half_life_items: null
ema_normalize_item_weights: true
commitment_beta: 0.25
rq_kmeans_init: true
kmeans_iters: 10
learning_rate: 0.001
epochs: 20000
batch_size: 1024
log_interval: 10
save_interval: 2000
tensorboard_enabled: false
tensorboard_dir: null
embedding_strategy: "mean_pooling"
final_model_decision: "save_best"
cf_emb_path: "sasrec_cf_embedding.pt"
diversity_beta: 1e-4
cf_alpha: 0.02

crab:
  enabled: false
  split_ratio: 0.10
  analysis_top_ratio: 0.05
  max_splits: 3
  balance_weight: 1.0
  kmeans_max_iter: 50
  reg_weight: 1e-3
  random_seed: 2026
