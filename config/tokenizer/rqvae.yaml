# RQ-VAE配置
data_text_files: "./data/Toy/item2title.pkl"
text_encoder_model: "../sentence-t5-base"
interaction_files: "./data/Toy/user2item.pkl"
sent_emb_dim: 768
n_codebooks: 4
codebook_size: 256
rq_e_dim: 32
rq_layers: [512, 256, 128]
dropout_prob: 0
loss_type: "mse"
quant_loss_weight: 0.25
popularity_balance_weight: 0.0
popularity_balance_mode: "batch_entropy"
popularity_balance_schedule: "constant"
popularity_balance_start_epoch: 0
popularity_balance_warmup_epochs: 0
popularity_softmax_temperature: 1.0
popularity_weight_transform: "nominal"
popularity_nominal_gamma: 0.5
popularity_nominal_clip_quantile: 0.995
popularity_nominal_clip_value: null
popularity_balance_eps: 1e-8
popularity_balance_disabled_layers: []
popularity_balance_layer_weights: []
popularity_balance_top_k: 0
popularity_prefix_balance_enabled: false
popularity_balance_log_distribution: false
popularity_balance_distribution_interval: 100
popularity_ema_half_life_epochs: 1.0
popularity_ema_half_life_items: null
popularity_ema_normalize_item_weights: true
commitment_beta: 0.25
rq_kmeans_init: true
kmeans_iters: 10
learning_rate: 0.001
epochs: 20000
batch_size: 1024
log_interval: 10
save_interval: 2000
tensorboard_enabled: false
tensorboard_dir: null
embedding_strategy: "mean_pooling"
final_model_decision: "save_best"
cf_emb_path: "sasrec_cf_embedding.pt"
diversity_beta: 1e-4
cf_alpha: 0.02

crab:
  enabled: false
  split_ratio: 0.10
  analysis_top_ratio: 0.05
  max_splits: 3
  balance_weight: 1.0
  kmeans_max_iter: 50
  reg_weight: 1e-3
  random_seed: 2026
