# 生成模型配置
data_interaction_files: "./data/Beauty/user2item.pkl"
data_text_files: "./data/Beauty/item2title.pkl"
max_seq_len: 20
padding_side: "left"
ignored_label: -100
vocab_size: 1024
d_kv: 64
d_ff: 1024
d_model: 128
num_layers: 4
num_decoder_layers: 4
num_heads: 6
dropout_rate: 0.1
tie_word_embeddings: true
batch_size: 1024
test_batch_size: 256
learning_rate: 2e-3
num_epochs: 200
num_steps: null
k_list: [1,5,10]
use_generative: true
num_beams: 10
inference_mode: "FastCBS"
max_gen_length: 5
weight_decay: 0.2
warmup_ratio: 0.05
early_stop_upper_steps: 5
evaluation_epoch: 5
use_user_tokens: false
tau: 1.0
# BQS uses paper-style popularity elbows computed from training interactions.
# A candidate only receives BQS values when this points to a baseline run that
# was evaluated with BQS enabled; baseline runs still record HR_L/NDCG_L.
bqs_enabled: true
bqs_baseline_metrics_path: null
bqs_hit_penalty: 10.0
bqs_ndcg_penalty: 2.0
bqs_temperature: 0.1
care_sid_length: 4
care_query_numbers: [1, 1, 4, 4]
care_alpha: 0.7
