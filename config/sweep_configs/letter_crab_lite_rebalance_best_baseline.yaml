name: letter_crab_lite_rebalance_best_baseline

datasets:
  - name: electronic
    max_seq_len: 20
  - name: movielens
    max_seq_len: 50
  - name: sports
    max_seq_len: 20
  - name: toy
    max_seq_len: 20

paths:
  interaction_template: ./data/{dataset}/user2item.pkl
  text_template: ./data/{dataset}/item2title.pkl
  tokenizer_template:
    by_dataset:
      electronic: output/letter_baseline_hparams/electronic/fixedtok_letter_mlr0p001_wd0p05/tokenizer_model
      movielens: output/letter_baseline_hparams/movielens/fixedtok_letter_mlr0p0015_wd0p1/tokenizer_model
      sports: output/letter_baseline_hparams/sports/fixedtok_letter_mlr0p0015_wd0p15/tokenizer_model
      toy: output/letter_baseline_hparams/toy/fixedtok_letter_mlr0p001_wd0p25/tokenizer_model

output:
  base_dir: output/test_letter_crab_lite_best_baseline

runtime:
  keep_going: true
  skip_completed: false
  write_task_logs: true
  gpu_groups:
    - ids: "0"
      port: 29624
    - ids: "1"
      port: 29625
    - ids: "2"
      port: 29626
    - ids: "3"
      port: 29627

experiment:
  crab_lite_script: tools/crab_lite_rebalance.py
  crab_config: config/tokenizer/rqvae.yaml
  crab_tokenizer_kind: letter
  crab_balance_weight: 1.0
  crab_batch_size: 4096
  crab_overwrite: true

stages:
  crab_lite: true
  tokenizer: false
  generation: false

sweep:
  output_prefix: letter_crab_bal1

summary:
  enabled: false

