name: crab_lite_rebalance_best_baseline

datasets:
  - name: electronic
    max_seq_len: 20
  - name: movielens
    max_seq_len: 50
  - name: sports
    max_seq_len: 20
  - name: toy
    max_seq_len: 20

paths:
  interaction_template: ./data/{dataset}/user2item.pkl
  text_template: ./data/{dataset}/item2title.pkl
  tokenizer_template:
    by_dataset:
      electronic: output/20260609_baseline_hparams/electronic/fixedtok_mlr0p001_wd0p05/tokenizer_model
      movielens: output/20260609_baseline_hparams/movielens/fixedtok_mlr0p001_wd0p1/tokenizer_model
      sports: output/20260609_baseline_hparams/sports/fixedtok_mlr0p001_wd0p15/tokenizer_model
      toy: output/20260609_baseline_hparams/toy/fixedtok_mlr0p0005_wd0p2/tokenizer_model

output:
  base_dir: output/test_crab_lite_best_baseline

runtime:
  keep_going: true
  skip_completed: false
  write_task_logs: true
  gpu_groups:
    - ids: "0"
      port: 29610
    - ids: "1"
      port: 29611
    - ids: "2"
      port: 29612
    - ids: "3"
      port: 29613

experiment:
  crab_lite_script: tools/crab_lite_rebalance.py
  crab_config: config/tokenizer/rqvae.yaml
  crab_balance_weight: 1.0
  crab_batch_size: 4096
  crab_overwrite: true

stages:
  crab_lite: true
  tokenizer: false
  generation: false

sweep:
  output_prefix: crab_bal1

summary:
  enabled: false
