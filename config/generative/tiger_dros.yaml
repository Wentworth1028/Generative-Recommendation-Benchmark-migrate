# DROS keeps the TIGER tokenizer, backbone, NLL, and constrained decoding.
type: "tiger_dros"
trainer:
  _target_: genrec.trainers.generative.dros_trainer.DROSTigerTrainer
  _partial_: true
  dros_temperature: 0.5
  dros_weight: 0.1
  popularity_temperature: 0.05
  num_negative_samples: 5
  score_transform: "sigmoid"
  popularity_scope: "model_window"
  item_pooling: "mean"
  exclude_eos_from_user: true
